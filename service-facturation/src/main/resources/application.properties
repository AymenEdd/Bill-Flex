spring.application.name=service-facturation
server.port=8082

# Config Server (optionnel pour démarrage résilient même si le serveur de configuration n'est pas encore prêt)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Base de données PostgreSQL NeonDB
spring.datasource.url=${FACTURATION_DB_URL:jdbc:postgresql://ep-silent-block-be18w4yy-pooler.c-9.us-east-2.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${FACTURATION_DB_USER:neondb_owner}
spring.datasource.password=${FACTURATION_DB_PASSWORD:npg_oEie5FH8Gyjx}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# OpenFeign URL par défaut si Eureka n'est pas démarré
service-abonnements.url=http://localhost:8081
service-clients.url=http://localhost:8083

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=service-facturation-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.abonnementService.sliding-window-size=10
resilience4j.circuitbreaker.instances.abonnementService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.abonnementService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.abonnementService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.clientService.sliding-window-size=10
resilience4j.circuitbreaker.instances.clientService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clientService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clientService.permitted-number-of-calls-in-half-open-state=3

# Resilience4j Retry (au moins 2 appels)
resilience4j.retry.instances.abonnementService.max-attempts=3
resilience4j.retry.instances.abonnementService.wait-duration=1s

resilience4j.retry.instances.clientService.max-attempts=3
resilience4j.retry.instances.clientService.wait-duration=1s

# Tâche planifiée des factures échues (tous les jours à 01h00)
invoices.scheduler.overdue.cron=0 0 1 * * *
