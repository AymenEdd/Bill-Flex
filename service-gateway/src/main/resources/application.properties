# ── Identification ───────────────────────────────────────────────────────────
spring.application.name=service-gateway
server.port=8089

# ── Config Server ─────────────────────────────────────────────────────────────
spring.config.import=optional:configserver:http://localhost:8888

# ── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── Redis (pour le rate limiting) ────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Routes Gateway ────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=service-clients
spring.cloud.gateway.routes[0].uri=lb://service-clients
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/clients/**,/api/payments/**
spring.cloud.gateway.routes[0].filters[0]=name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args[key-resolver]=#{@ipKeyResolver}
spring.cloud.gateway.routes[0].filters[0].args[redis-rate-limiter.replenishRate]=10
spring.cloud.gateway.routes[0].filters[0].args[redis-rate-limiter.burstCapacity]=20
spring.cloud.gateway.routes[0].filters[0].args[redis-rate-limiter.requestedTokens]=1

spring.cloud.gateway.routes[1].id=service-facturation
spring.cloud.gateway.routes[1].uri=lb://service-facturation
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/invoices/**
spring.cloud.gateway.routes[1].filters[0]=name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args[key-resolver]=#{@ipKeyResolver}
spring.cloud.gateway.routes[1].filters[0].args[redis-rate-limiter.replenishRate]=10
spring.cloud.gateway.routes[1].filters[0].args[redis-rate-limiter.burstCapacity]=20
spring.cloud.gateway.routes[1].filters[0].args[redis-rate-limiter.requestedTokens]=1

spring.cloud.gateway.routes[2].id=service-abonnements
spring.cloud.gateway.routes[2].uri=lb://service-abonnements
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/plans/**,/api/subscriptions/**,/api/abonnements/**,/plans/**,/subscriptions/**
spring.cloud.gateway.routes[2].filters[0]=name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[0].args[key-resolver]=#{@ipKeyResolver}
spring.cloud.gateway.routes[2].filters[0].args[redis-rate-limiter.replenishRate]=10
spring.cloud.gateway.routes[2].filters[0].args[redis-rate-limiter.burstCapacity]=20
spring.cloud.gateway.routes[2].filters[0].args[redis-rate-limiter.requestedTokens]=1

spring.cloud.gateway.routes[3].id=service-notifications
spring.cloud.gateway.routes[3].uri=lb://service-notifications
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[3].filters[0]=name=RequestRateLimiter
spring.cloud.gateway.routes[3].filters[0].args[key-resolver]=#{@ipKeyResolver}
spring.cloud.gateway.routes[3].filters[0].args[redis-rate-limiter.replenishRate]=10
spring.cloud.gateway.routes[3].filters[0].args[redis-rate-limiter.burstCapacity]=20
spring.cloud.gateway.routes[3].filters[0].args[redis-rate-limiter.requestedTokens]=1

# ── Load Balancing (round-robin par défaut avec Eureka) ─────────────────────
spring.cloud.loadbalancer.ribbon.enabled=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.cloud.gateway=DEBUG
