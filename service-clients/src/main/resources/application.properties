# ── Identification ───────────────────────────────────────────────────────────
spring.application.name=service-clients
server.port=8083

# ── Config Server ─────────────────────────────────────────────────────────────
spring.config.import=optional:configserver:http://localhost:8888

# ── Base de données PostgreSQL dédiée (fallback si Config Server non joignable) ─
spring.datasource.url=jdbc:postgresql://ep-withered-unit-be6gs1fn-pooler.c-9.us-east-2.aws.neon.tech:5432/clients-microservice?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_O6nfHYeiM3cW
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── Kafka Configuration (compatible toute la stack) ──────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=service-clients-group
spring.kafka.listener.auto-startup=false

# ── Feign ─────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.gmp.serviceclients=INFO
logging.level.org.apache.kafka=WARN
