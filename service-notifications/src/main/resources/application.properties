spring.application.name=service-notifications
server.port=8084
server.address=${NOTIFICATIONS_BIND_ADDRESS:127.0.0.1}

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

spring.datasource.url=${NOTIFICATIONS_DB_URL:jdbc:postgresql://localhost:55434/notifications}
spring.datasource.username=${NOTIFICATIONS_DB_USER:notifications}
spring.datasource.password=${NOTIFICATIONS_DB_PASSWORD:}
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATIONS_KAFKA_GROUP:bill-flex-notifications}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=record

notifications.customer.url=${NOTIFICATIONS_CUSTOMER_URL:}
spring.cloud.openfeign.client.config.service-clients.connect-timeout=1000
spring.cloud.openfeign.client.config.service-clients.read-timeout=1500

spring.mail.host=${NOTIFICATIONS_SMTP_HOST:localhost}
spring.mail.port=${NOTIFICATIONS_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
notifications.mail.from=${NOTIFICATIONS_MAIL_FROM:notifications@bill-flex.test}

notifications.delivery.retry-delay=30s
notifications.delivery.scan-delay=5s
