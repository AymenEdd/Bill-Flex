spring.application.name=service-notifications
server.port=8085

# Config Server (optionnel pour démarrage résilient)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.enabled=${EUREKA_ENABLED:true}

# Base de données PostgreSQL NeonDB
spring.datasource.url=${NOTIFICATIONS_DB_URL:jdbc:postgresql://ep-silent-block-be18w4yy-pooler.c-9.us-east-2.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${NOTIFICATIONS_DB_USER:neondb_owner}
spring.datasource.password=${NOTIFICATIONS_DB_PASSWORD:npg_oEie5FH8Gyjx}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATIONS_KAFKA_GROUP:bill-flex-notifications}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=record

# OpenFeign Client
notifications.customer.url=${NOTIFICATIONS_CUSTOMER_URL:http://localhost:8083}
spring.cloud.openfeign.client.config.service-clients.connect-timeout=2000
spring.cloud.openfeign.client.config.service-clients.read-timeout=3000

# Mail / MailHog Configuration
spring.mail.host=${NOTIFICATIONS_SMTP_HOST:localhost}
spring.mail.port=${NOTIFICATIONS_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
notifications.mail.from=${NOTIFICATIONS_MAIL_FROM:notifications@bill-flex.test}

# Job de relance des notifications en attente
notifications.delivery.retry-delay=30s
notifications.delivery.scan-delay=5s
