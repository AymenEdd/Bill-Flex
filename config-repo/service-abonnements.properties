# RESILIENCE4J - CIRCUIT BREAKER
resilience4j.circuitbreaker.instances.clientById.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.clientById.slidingWindowSize=5
resilience4j.circuitbreaker.instances.clientById.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.clientById.failureRateThreshold=50
resilience4j.circuitbreaker.instances.clientById.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.clientById.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.clientsList.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.clientsList.slidingWindowSize=5
resilience4j.circuitbreaker.instances.clientsList.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.clientsList.failureRateThreshold=50
resilience4j.circuitbreaker.instances.clientsList.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.clientsList.permittedNumberOfCallsInHalfOpenState=2


# RESILIENCE4J - RETRY
resilience4j.retry.instances.clientById.maxAttempts=3
resilience4j.retry.instances.clientById.waitDuration=500ms

resilience4j.retry.instances.clientsList.maxAttempts=3
resilience4j.retry.instances.clientsList.waitDuration=500ms
